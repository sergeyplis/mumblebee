[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mumblebee"
version = "0.1.0"
description = "Turn messy PDFs, EPUBs, and OCR'd books into clean, chaptered, cover-tagged local audiobooks using local LLMs and parallel ONNX TTS."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sergey Plis" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "soundfile>=0.12",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9.4",
    "torch>=2.4",
]
tiny-voca = [
    "tiny-voca @ git+https://github.com/n4ze3m/tiny-voca",
    "dizione @ git+https://github.com/n4ze3m/dizione",
    "torch>=2.4",
]
all = [
    "mumblebee[kokoro,tiny-voca]",
]

[project.scripts]
mumblebee = "mumblebee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
